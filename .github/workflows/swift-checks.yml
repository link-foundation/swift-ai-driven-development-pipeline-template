name: Swift Checks

on:
  pull_request:
  merge_group:
  schedule:
    - cron: '19 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    uses: ./.github/workflows/swift-ci.yml # zizmor: ignore[self-repository] actionlint 1.7.12 requires the GitHub-supported relative syntax.
    with:
      mode: standalone
